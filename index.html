<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111418">
<link rel="manifest" href="manifest.json">
<title>서재</title>
<style>
  :root{ --bg:#111418; --panel:#191d23; --line:#2a3038; --tx:#e6e9ee;
    --dim:#8b95a3; --acc:#6ea8fe; --bad:#ff8a8a; --ok:#7ee0a0;
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
    --paper:#fff; --ink:#16181c; --barbg:#ffffffee; --barfg:#4a5260;
    --cw:104px; --tap:30%; --pv:16px; --ph:6%; }
  body.sepia{ --paper:#f6efe2; --ink:#3b3228; --barbg:#f6efe2ee; --barfg:#6b5f4e; }
  body.night{ --paper:#15181c; --ink:#c7ccd4; --barbg:#15181cee; --barfg:#8b95a3; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--tx);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  button,input,select{font:inherit;color:inherit}
  button{background:none;border:none;cursor:pointer}

  /* ── 서재 ── */
  #library{display:flex;flex-direction:column;height:100%}
  header{padding:calc(var(--st) + 10px) 12px 8px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .row{display:flex;gap:8px;align-items:center}
  #q{flex:1;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);outline:none}
  #q:focus{border-color:var(--acc)}
  .ib{padding:9px 11px;border-radius:10px;background:var(--panel);
    border:1px solid var(--line);font-size:15px}
  .ib.warn{border-color:var(--bad);color:var(--bad)}
  .ib.good{border-color:var(--ok);color:var(--ok)}
  /* 상태 탭 — 전체 / 읽는 중 / 다 읽음 / 받아둔 책 */
  #tabs{display:flex;gap:2px;margin-top:10px;border-bottom:1px solid var(--line)}
  #tabs button{flex:1;padding:8px 4px 9px;font-size:13px;color:var(--dim);
    border-bottom:2px solid transparent;white-space:nowrap}
  #tabs button.on{color:var(--acc);border-bottom-color:var(--acc);font-weight:600}
  #tabs .n{font-size:11px;opacity:.75}

  #chips{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;scrollbar-width:none}
  #chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:6px 12px;border-radius:999px;background:var(--panel);
    border:1px solid var(--line);color:var(--dim);font-size:13px}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#0b1220;font-weight:600}
  .chip.up{color:var(--acc)}
  #stat{padding:6px 2px 0;color:var(--dim);font-size:12px;white-space:pre-wrap}
  #stat.err{color:var(--bad)}

  #grid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:14px 12px calc(var(--sb) + 30px)}
  #grid.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:14px 10px}
  #grid.l{display:flex;flex-direction:column;gap:0}
  .card{cursor:pointer}
  #grid.l .card{display:flex;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line)}
  #grid.l .cvw{width:52px;flex:0 0 52px}
  #grid.l .meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
  #grid.l .ti{-webkit-line-clamp:2;margin-top:0;font-size:14px}
  .cvw{position:relative;width:100%;aspect-ratio:2/3;border-radius:6px;overflow:hidden;
    background:var(--panel);box-shadow:0 2px 10px #0006;
    display:flex;align-items:center;justify-content:center}
  .cvw img{width:100%;height:100%;object-fit:cover;display:block}
  .cvw .ph{font-size:11px;color:var(--dim);padding:6px;text-align:center;
    display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
  .tag{position:absolute;left:4px;top:4px;background:#000a;font-size:9px;
    padding:2px 5px;border-radius:4px}
  .tag.dl{color:var(--ok)} .tag.fm{color:var(--dim);left:auto;right:4px}
  .tag.done{color:#ffd479;left:auto;right:4px;top:auto;bottom:4px}
  /* 표지 아래 읽은 진도 */
  .pbar{position:absolute;left:0;right:0;bottom:0;height:3px;background:#0006}
  .pbar i{display:block;height:100%;background:var(--acc)}
  .cvw.fin{filter:saturate(.55) brightness(.85)}
  .ti{font-size:12px;margin-top:6px;line-height:1.35;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .au{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub{font-size:11px;color:var(--dim)}
  #more{padding:16px;text-align:center;color:var(--dim);font-size:13px;grid-column:1/-1}

  /* ── 리더 ── */
  #reader{position:fixed;inset:0;background:var(--paper);display:none;flex-direction:column;z-index:20}
  #view{flex:1;position:relative;background:var(--paper)}
  /* 본문 자리 — 여백은 '틀'에서 줍니다.
     책 안쪽(body)에 padding 을 주면 epub.js 가 단을 나눌 때 무시해 버립니다. */
  #page{position:absolute;left:var(--ph);right:var(--ph);
    top:calc(var(--st) + 46px + var(--pv)); bottom:calc(var(--sb) + 34px + var(--pv))}
  #rbar{position:absolute;top:0;left:0;right:0;z-index:5;padding:calc(var(--st) + 6px) 10px 6px;
    background:linear-gradient(var(--barbg) 70%,transparent);
    display:flex;gap:6px;align-items:center;transition:opacity .2s}
  #rbar .ib{background:#00000010;border-color:#00000022;color:var(--barfg);padding:7px 10px}
  body.night #rbar .ib{background:#ffffff12;border-color:#ffffff20}
  #rtitle{flex:1;font-size:12px;color:var(--barfg);white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  #rfoot{position:absolute;bottom:0;left:0;right:0;z-index:5;
    padding:6px 12px calc(var(--sb) + 6px);color:var(--barfg);font-size:11px;text-align:center;
    background:linear-gradient(transparent,var(--barbg) 40%);transition:opacity .2s}
  .hide{opacity:0;pointer-events:none}
  #tapL,#tapR{position:absolute;top:calc(var(--st) + 46px + var(--pv));
    bottom:calc(var(--sb) + 34px + var(--pv));width:var(--tap);z-index:3}
  #tapL{left:0} #tapR{right:0}

  /* ── 아래에서 올라오는 설정판 ── */
  .pan{position:fixed;left:0;right:0;bottom:0;z-index:65;background:var(--panel);
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    padding:14px 16px calc(var(--sb) + 18px);transform:translateY(102%);
    transition:transform .22s ease;max-height:80vh;overflow:auto;color:var(--tx)}
  .pan.on{transform:translateY(0)}
  .pan h4{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  .pan h4 button{color:var(--dim);font-size:13px}
  .grp{margin:14px 0 0}
  .grp .lb{font-size:12px;color:var(--dim);margin-bottom:6px;display:flex;justify-content:space-between}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{flex:1;min-width:60px;padding:9px 6px;border-radius:9px;border:1px solid var(--line);
    background:var(--bg);font-size:13px}
  .seg button.on{background:var(--acc);border-color:var(--acc);color:#0b1220;font-weight:600}
  input[type=range]{width:100%;accent-color:var(--acc)}
  .backdrop{position:fixed;inset:0;background:#0007;z-index:64;display:none}
  .backdrop.on{display:block}

  #busy{position:fixed;inset:0;background:#111418f5;z-index:70;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;color:var(--tx)}
  #busy .t{font-size:14px;text-align:center;line-height:1.6}
  #busy .barw{width:min(280px,70%);height:5px;background:var(--panel);border-radius:99px;overflow:hidden}
  #busy .bar{height:100%;width:0;background:var(--acc);transition:width .15s}
  #busy .s{font-size:12px;color:var(--dim)}
  #busy button{margin-top:6px;padding:9px 18px;border:1px solid var(--line);border-radius:9px}

  .sheet{position:fixed;inset:0;background:#000a;display:none;z-index:80;
    align-items:center;justify-content:center;padding:18px}
  .sheet.on{display:flex}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;
    width:100%;max-width:440px;max-height:82vh;overflow:auto;color:var(--tx)}
  .box h3{margin:0 0 4px;font-size:16px}
  .box label{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
  .box input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);
    background:var(--bg);outline:none}
  .box .sect{margin:18px 0 2px;padding-top:12px;border-top:1px solid var(--line);
    font-size:12px;color:var(--acc);font-weight:600}
  .box .sect span{color:var(--dim);font-weight:400}
  .box .note{margin:8px 0 0;font-size:11.5px;color:var(--dim);line-height:1.55}
  .box .note b{color:var(--tx);font-weight:600}
  .box .btns{display:flex;gap:8px;margin-top:10px}
  .box .btns button{flex:1;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--bg)}
  .box .btns .pri{background:var(--acc);border-color:var(--acc);color:#0b1220;font-weight:600}
  #log{margin-top:12px;font-size:11px;color:var(--dim);white-space:pre-wrap;background:var(--bg);
    border:1px solid var(--line);border-radius:8px;padding:10px;max-height:200px;overflow:auto}

  #toast{position:fixed;left:50%;bottom:calc(var(--sb) + 22px);transform:translateX(-50%);
    background:#222831f2;border:1px solid var(--line);padding:11px 16px;border-radius:10px;
    font-size:13px;z-index:90;display:none;max-width:88%;text-align:center;white-space:pre-wrap;color:var(--tx)}
</style>
</head>
<body>

<div id="library">
  <header>
    <div class="row">
      <input id="q" type="search" placeholder="제목 · 저자 · 분류로 검색" autocomplete="off">
      <button class="ib" id="btnLogin" title="구글 로그인">🔑</button>
      <button class="ib" id="btnView" title="보기 설정">☰</button>
      <button class="ib" id="btnSet" title="설정">⚙</button>
    </div>
    <div id="tabs">
      <button data-v="">전체</button>
      <button data-v="recent">최근</button>
      <button data-v="reading">읽는 중</button>
      <button data-v="done">다 읽음</button>
      <button data-v="saved">받아둔</button>
    </div>
    <div id="chips"></div>
    <div id="stat">시작하는 중…</div>
  </header>
  <div id="grid" class="g"></div>
</div>

<div id="reader">
  <div id="view"><div id="page"></div><div id="tapL"></div><div id="tapR"></div></div>
  <div id="rbar">
    <button class="ib" id="btnClose">‹ 서재</button>
    <div id="rtitle"></div>
    <button class="ib" id="btnAa">Aa</button>
  </div>
  <div id="rfoot"></div>
</div>

<div class="backdrop" id="bd"></div>

<!-- 읽기 설정 -->
<div class="pan" id="panRead">
  <h4>읽기 설정 <button data-close>닫기</button></h4>
  <div class="grp"><div class="lb">종이색</div>
    <div class="seg" id="segTheme">
      <button data-v="light">밝게</button><button data-v="sepia">세피아</button><button data-v="night">어둡게</button>
    </div></div>
  <div class="grp"><div class="lb"><span>글자 크기</span><span id="vFs"></span></div>
    <input type="range" id="rgFs" min="70" max="220" step="5"></div>
  <div class="grp"><div class="lb"><span>줄 간격</span><span id="vLh"></span></div>
    <input type="range" id="rgLh" min="120" max="240" step="5"></div>
  <div class="grp"><div class="lb"><span>좌우 여백</span><span id="vPd"></span></div>
    <input type="range" id="rgPd" min="0" max="16" step="1"></div>
  <div class="grp"><div class="lb"><span>상하 여백</span><span id="vPv"></span></div>
    <input type="range" id="rgPv" min="0" max="80" step="4"></div>
  <div class="grp"><div class="lb">글꼴</div>
    <div class="seg" id="segFont">
      <button data-v="">책 기본</button><button data-v="sans">고딕</button><button data-v="serif">명조</button>
    </div></div>
  <div class="grp"><div class="lb">넘기는 방법</div>
    <div class="seg" id="segNav">
      <button data-v="tap">좌우 탭</button><button data-v="swipe">밀어서</button><button data-v="both">둘 다</button>
    </div></div>
  <div class="grp"><div class="lb"><span>탭 영역 폭</span><span id="vTap"></span></div>
    <input type="range" id="rgTap" min="15" max="45" step="1"></div>
  <div class="grp"><div class="lb">이 책 상태</div>
    <div class="seg">
      <button id="mkReading">읽는 중으로</button>
      <button id="mkDone">다 읽음으로</button>
    </div></div>
</div>

<!-- 보기 설정 -->
<div class="pan" id="panView">
  <h4>보기 설정 <button data-close>닫기</button></h4>
  <div class="grp"><div class="lb">보기</div>
    <div class="seg" id="segMode">
      <button data-v="g">표지</button><button data-v="l">목록</button>
    </div></div>
  <div class="grp"><div class="lb">표지 크기</div>
    <div class="seg" id="segSize">
      <button data-v="72">아주 작게</button><button data-v="104">작게</button>
      <button data-v="140">보통</button><button data-v="190">크게</button>
    </div></div>
  <div class="grp"><div class="lb">보여줄 형식</div>
    <div class="seg" id="segFmt">
      <button data-v="epub">EPUB</button><button data-v="pdf">PDF</button>
      <button data-v="etc">그 외</button>
    </div></div>
  <div class="grp"><div class="lb">정렬 <span style="opacity:.7">· 읽는 중·다 읽음 칸은 최근 읽은 순</span></div>
    <div class="seg" id="segSort">
      <button data-v="t">제목</button><button data-v="a">저자</button>
      <button data-v="d">출간일</button><button data-v="r">최근 읽음</button>
      <button data-v="z">크기</button>
    </div></div>
  <div class="grp"><div class="lb">분류 기준</div>
    <div class="seg" id="segCat">
      <button data-v="tree">계층</button><button data-v="b">대분류</button>
      <button data-v="m">중분류</button><button data-v="s">소분류</button><button data-v="f">폴더</button>
    </div></div>
</div>

<div id="busy">
  <div class="t" id="busyT">여는 중…</div>
  <div class="barw"><div class="bar" id="busyB"></div></div>
  <div class="s" id="busyS"></div>
  <button id="busyX">취소</button>
</div>

<div class="sheet" id="setSheet">
  <div class="box">
    <h3>연결 설정</h3>
    <label>Apps Script 웹앱 주소</label><input id="sUrl">
    <label>토큰</label><input id="sTok">
    <label>구글 클라이언트 ID</label><input id="sCid">
    <div class="btns"><button id="setCancel">닫기</button>
      <button id="setSave" class="pri">저장하고 새로고침</button></div>
    <div class="btns"><button id="btnSync2">목록 새로 받기</button></div>

    <div class="sect">저장 공간<span id="useInfo"></span></div>
    <div class="btns"><button id="btnClearDone">다 읽은 책 파일 비우기</button></div>
    <div class="btns"><button id="btnClearBooks">받아둔 파일 모두 비우기</button></div>
    <p class="note">파일만 지웁니다. <b>읽은 기록(진도·다 읽음)은 그대로 남습니다.</b>
      다시 열면 자동으로 받아서 읽던 위치로 갑니다.</p>

    <div class="sect">읽은 기록</div>
    <div class="btns"><button id="btnClearRead">읽은 기록 모두 지우기</button></div>
    <p class="note">진도·다 읽음 표시가 사라집니다. 파일은 그대로 둡니다.</p>

    <div class="sect">그 밖에</div>
    <div class="btns"><button id="btnClearAll">전부 초기화</button></div>
    <div id="log"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="onGis()"></script>
<script>
/* ============================================================
   전자책 서재 (v4)
   v4 — 읽기 설정(Aa) · 보기 설정(☰) 을 판으로 분리
        종이색 / 글자크기 / 줄간격 / 여백 / 글꼴 / 넘김방식·폭
        표지크기 / 목록·격자 / 정렬 / 분류 기준(계층·대·중·소·폴더)
   ============================================================ */
const BUILD='v10';

const DEF={
  url:'https://script.google.com/macros/s/AKfycbz3IrNmHMSEUK2OZPiaPxn-JZ0hsdLqrBtNwwmj_HkfuLGcT-g_BOOzHnbvMmc6z57n/exec',
  tok:'maumpro-library-2026',
  cid:'552041627002-sd7fu1457pgd3bd2k2biicpoqqf12tlm.apps.googleusercontent.com'
};
const SCOPE='https://www.googleapis.com/auth/drive.readonly';
const PAGE=60;

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const cfg=k=>localStorage.getItem('ebl_'+k)||DEF[k];
const setCfg=(k,v)=>localStorage.setItem('ebl_'+k,v);

/* 사용자 설정 (기기에 저장) */
const P = Object.assign({
  theme:'light', fs:110, lh:170, pd:6, pv:16, font:'', nav:'both', tap:30,
  mode:'g', size:104, sort:'t', cat:'tree',
  fmt:{ epub:true, pdf:true, etc:false }     // 보여줄 형식 (그 외는 기본 감춤)
}, JSON.parse(localStorage.getItem('ebl_pref')||'{}'));
if(!P.fmt) P.fmt={ epub:true, pdf:true, etc:false };
const savePref=()=>localStorage.setItem('ebl_pref',JSON.stringify(P));

let BOOKS=[],HAY=[],UPDATED='',shown=0,rows=[];
let TAB=localStorage.getItem('ebl_tab')||'';   // 상태 탭
let PATH=[];                              // 계층 탐색 경로 [대,중]
let TOKEN='',tokenClient=null,gisReady=false,saved=new Set();

const LOG=[];
function log(m){ const s=new Date().toTimeString().slice(0,8)+'  '+m;
  LOG.push(s); if(LOG.length>60)LOG.shift();
  const el=$('#log'); if(el)el.textContent=LOG.join('\n'); console.log(s); }
function stat(m,bad){ $('#stat').textContent=m; $('#stat').classList.toggle('err',!!bad); }
function toast(m,ms=2600){ const t=$('#toast'); t.textContent=m; t.style.display='block';
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none',ms); }
const nfc=s=>{try{return String(s??'').normalize('NFC')}catch(e){return String(s??'')}};
const norm=s=>nfc(s).toLowerCase().replace(/\s+/g,'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ── 저장소 ── */
const DB=(()=>{ let db;
  const open=()=>new Promise((ok,ng)=>{ if(db)return ok(db);
    const r=indexedDB.open('ebl',1);
    r.onupgradeneeded=e=>{const d=e.target.result;
      if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');
      if(!d.objectStoreNames.contains('books'))d.createObjectStore('books');};
    r.onsuccess=e=>{db=e.target.result;ok(db)}; r.onerror=()=>ng(r.error); });
  const tx=async(s,m,fn)=>{const d=await open();
    return new Promise((ok,ng)=>{const t=d.transaction(s,m),o=t.objectStore(s),q=fn(o);
      t.oncomplete=()=>ok(q&&q.result); t.onerror=()=>ng(t.error);});};
  return{ get:(s,k)=>tx(s,'readonly',o=>o.get(k)), put:(s,k,v)=>tx(s,'readwrite',o=>o.put(v,k)),
    del:(s,k)=>tx(s,'readwrite',o=>o.delete(k)),
    keys:s=>tx(s,'readonly',o=>o.getAllKeys()), clear:s=>tx(s,'readwrite',o=>o.clear()) };
})();

/* ── 로그인 ── */
function onGis(){
  gisReady=true; log('로그인 모듈 준비');
  try{ tokenClient=google.accounts.oauth2.initTokenClient({
    client_id:cfg('cid'), scope:SCOPE,
    callback:r=>{ if(r.error){ log('로그인 실패: '+r.error); markLogin(false);
        (needToken._ng||(()=>{}))(new Error(r.error)); return; }
      TOKEN=r.access_token; sessionStorage.setItem('ebl_at',TOKEN);
      log('로그인 성공'); markLogin(true); (needToken._ok||(()=>{}))(TOKEN); }});
  }catch(e){ log('로그인 오류: '+e.message); }
  const c=sessionStorage.getItem('ebl_at'); if(c){TOKEN=c;markLogin(true);}
}
function markLogin(ok){ const b=$('#btnLogin');
  b.classList.toggle('good',ok); b.classList.toggle('warn',!ok); }
function needToken(inter){ return new Promise((ok,ng)=>{
  if(TOKEN)return ok(TOKEN);
  if(!gisReady||!tokenClient)return ng(new Error('로그인 모듈 준비 중입니다.\n잠시 후 🔑 를 눌러주세요.'));
  needToken._ok=ok; needToken._ng=ng;
  tokenClient.requestAccessToken({prompt:inter?'consent':''}); }); }

/* ── 색인 ── */
async function boot(){
  try{ (await DB.keys('books')||[]).forEach(k=>saved.add(k)); }catch(e){}
  let c=null; try{ c=await DB.get('kv','index'); }catch(e){}
  if(c){ apply(c); render(true); log('저장된 색인 ('+BOOKS.length+'권)'); }
  else{ stat('처음이라 서재를 받아옵니다. 30초쯤 걸립니다…');
    try{ await fetchIndex(); render(true); }
    catch(e){ stat('목록을 못 받았습니다.\n'+e.message,true); } }
}
async function fetchIndex(){
  const u=cfg('url')+(cfg('url').includes('?')?'&':'?')+'token='+encodeURIComponent(cfg('tok'));
  const r=await fetch(u); if(!r.ok)throw new Error('서버 응답 '+r.status);
  const d=await r.json(); if(d.error)throw new Error(d.error);
  await DB.put('kv','index',d); apply(d); log('색인 '+d.count+'권');
}
function apply(d){
  BOOKS=d.books||[]; UPDATED=d.updated||'';
  BOOKS.forEach(b=>{ if(b.a)b.a=b.a.replace(/\s*\([^)]*\)/g,'').trim(); });
  HAY=BOOKS.map(b=>norm([b.t,b.o,b.a,b.p,b.c].filter(Boolean).join('|')));
}

/* ── 읽은 기록 ──
   { 파일ID: { p:진도(0~1), t:마지막 읽은 시각, f:1이면 다 읽음 } }        */
let RD = JSON.parse(localStorage.getItem('ebl_read')||'{}');
const saveRD = () => { try{ localStorage.setItem('ebl_read',JSON.stringify(RD)); }catch(e){} };
const DONE_AT = 0.985;                       // 이 이상 읽으면 '다 읽음'

function markRead(id,p,forceDone,forceReading){
  const r = RD[id] || (RD[id]={});
  if(p!=null && !isNaN(p)) r.p = Math.max(0,Math.min(1,p));
  r.t = Date.now();
  if(forceDone) r.f=1;
  if(forceReading){ r.f=0; if(r.p>=DONE_AT) r.p=0.99; }
  else if((r.p||0) >= DONE_AT) r.f=1;
  saveRD();
}
const stOf = b => { const r=RD[b.i]; if(!r) return ''; return r.f ? 'done' : 'reading'; };
const pctOf = b => { const r=RD[b.i]; return r&&r.p ? r.p : 0; };

/* 예전 버전에서 남긴 '읽던 위치'를 읽은 기록으로 옮깁니다 */
(function migrate(){
  let n=0;
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k && k.startsWith('ebl_pos_')){
      const id=k.slice(8);
      if(!RD[id]){ RD[id]={p:0.01,t:Date.now(),f:0}; n++; }
    }
  }
  if(n) saveRD();
})();

/* ── 분류 · 형식 ── */
const folderOf=b=>String(b.f||'').split('/')[1]||'';
// 형식을 세 갈래로 묶습니다: EPUB / PDF / 그 외(txt·mobi·cbz…)
function fmtKey(b){ const x=(b.x||'').toLowerCase();
  return x==='epub'?'epub' : x==='pdf'?'pdf' : 'etc'; }
function chipSource(){
  // 현재 기준으로 [값 → 권수] 집계
  const c={};
  BOOKS.forEach(b=>{
    if(!P.fmt[fmtKey(b)]) return;          // 감춘 형식은 분류 집계에서도 제외
    let k='';
    if(P.cat==='f') k=folderOf(b);
    else if(P.cat==='tree') k = PATH.length===0? b.b : PATH.length===1? (b.b===PATH[0]?b.m:'') : (b.m===PATH[1]?b.s:'');
    else k=b[P.cat]||'';
    if(k) c[k]=(c[k]||0)+1;
  });
  return c;
}
function buildChips(){
  const c=chipSource();
  const keys=Object.keys(c).sort((a,b)=>c[b]-c[a]).slice(0,40);
  const el=$('#chips'); el.innerHTML='';
  const add=(label,fn,cls)=>{ const b=document.createElement('button');
    b.className='chip'+(cls?' '+cls:''); b.textContent=label; b.onclick=fn; el.appendChild(b); };

  if(P.cat==='tree'){
    if(PATH.length) add('‹ '+(PATH[PATH.length-1]), ()=>{PATH.pop();buildChips();render(true);},'up');
    else add('전체',()=>{PATH=[];buildChips();render(true);}, SEL?'':'on');
    keys.forEach(k=>add(k+' '+c[k],()=>{ if(PATH.length<2){PATH.push(k);buildChips();render(true);} },
      PATH[PATH.length-1]===k?'on':''));
  } else {
    add('전체',()=>{SEL='';buildChips();render(true);}, SEL?'':'on');
    keys.forEach(k=>add(k,()=>{SEL=(SEL===k?'':k);buildChips();render(true);}, SEL===k?'on':''));
  }
}
let SEL='';

/* ── 목록 ── */
function match(b){
  if(!P.fmt[fmtKey(b)]) return false;
  if(TAB==='recent'  && !RD[b.i])            return false;   // 한 번이라도 연 책
  if(TAB==='reading' && stOf(b)!=='reading') return false;
  if(TAB==='done'    && stOf(b)!=='done')    return false;
  if(TAB==='saved'   && !saved.has(b.i))     return false;
  if(P.cat==='tree'){
    if(PATH[0]&&b.b!==PATH[0])return false;
    if(PATH[1]&&b.m!==PATH[1])return false;
    return true;
  }
  if(!SEL)return true;
  return (P.cat==='f'? folderOf(b) : (b[P.cat]||'')) === SEL;
}
function filter(){
  const k=norm($('#q').value), out=[];
  for(let i=0;i<BOOKS.length;i++){ const b=BOOKS[i];
    if(!match(b))continue;
    if(k&&HAY[i].indexOf(k)<0)continue;
    out.push(b); if(out.length>=3000)break; }
  // 최근·읽는 중·다 읽음 칸은 최근 읽은 순이 자연스럽습니다
  const s = (TAB==='recent'||TAB==='reading'||TAB==='done') ? 'r' : P.sort;
  out.sort((x,y)=>{
    if(s==='r')return ((RD[y.i]&&RD[y.i].t)||0)-((RD[x.i]&&RD[x.i].t)||0);
    if(s==='d')return String(y.d||'').localeCompare(String(x.d||''));
    if(s==='z')return (y.z||0)-(x.z||0);
    return String(x[s]||'').localeCompare(String(y[s]||''),'ko');
  });
  return out;
}
function render(reset){
  const g=$('#grid');
  g.className=P.mode; document.documentElement.style.setProperty('--cw',P.size+'px');
  if(reset){ rows=filter(); shown=0; g.innerHTML=''; g.scrollTop=0; }
  stat(`${BOOKS.length.toLocaleString()}권 중 ${rows.length.toLocaleString()}권`
    +(UPDATED?`  ·  갱신 ${UPDATED}`:'')
    +(saved.size?`  ·  받아둔 책 ${saved.size}`:'')+`  ·  ${BUILD}`);
  const o=$('#more'); if(o)o.remove();
  const f=document.createDocumentFragment();
  const end=Math.min(shown+PAGE,rows.length);
  for(let i=shown;i<end;i++)f.appendChild(card(rows[i]));
  shown=end; g.appendChild(f);
  if(shown<rows.length){ const m=document.createElement('div'); m.id='more';
    m.textContent=`더 보기 (${(rows.length-shown).toLocaleString()}권 남음)`;
    m.onclick=()=>render(false); g.appendChild(m); }
}
function card(b){
  const d=document.createElement('div'); d.className='card';
  const w=document.createElement('div'); w.className='cvw';
  if(b.v){ const im=document.createElement('img'); im.loading='lazy'; im.decoding='async'; im.src=b.v;
    im.onerror=()=>{im.remove(); w.insertAdjacentHTML('afterbegin',`<div class="ph">${esc(b.t||'')}</div>`);};
    w.appendChild(im); }
  else w.innerHTML=`<div class="ph">${esc(b.t||'')}</div>`;
  if(saved.has(b.i))w.insertAdjacentHTML('beforeend','<div class="tag dl">저장됨</div>');
  const x=(b.x||'').toUpperCase();
  if(x&&x!=='EPUB')w.insertAdjacentHTML('beforeend',`<div class="tag fm">${x}</div>`);
  const st=stOf(b), pc=pctOf(b);
  if(st==='done'){ w.classList.add('fin');
    w.insertAdjacentHTML('beforeend','<div class="tag done">다 읽음</div>'); }
  else if(st==='reading'&&pc>0)
    w.insertAdjacentHTML('beforeend',`<div class="pbar"><i style="width:${Math.round(pc*100)}%"></i></div>`);
  const t=document.createElement('div'); t.className='ti'; t.textContent=b.t||'';
  const a=document.createElement('div'); a.className='au'; a.textContent=b.a||'';
  if(P.mode==='l'){
    const m=document.createElement('div'); m.className='meta';
    const s=document.createElement('div'); s.className='sub';
    const mark = st==='done' ? '다 읽음' : (st==='reading'&&pc>0 ? Math.round(pc*100)+'%' : '');
    s.textContent=[mark,b.p,String(b.d||'').slice(0,4),b.s||b.m||b.b,x].filter(Boolean).join(' · ');
    m.append(t,a,s); d.append(w,m);
  } else d.append(w,t,a);
  d.addEventListener('click',()=>openBook(b)); return d;
}

/* ── 열기 ── */
let abort=null;
function busy(on,t,s,p){ $('#busy').style.display=on?'flex':'none';
  if(t!=null)$('#busyT').textContent=t; if(s!=null)$('#busyS').textContent=s;
  $('#busyB').style.width=((p||0)*100)+'%'; }
$('#busyX').onclick=()=>{ if(abort)abort.abort(); busy(false); };

async function openBook(b){
  const ext=(b.x||'').toLowerCase();
  if(ext!=='epub'){ if(b.u)window.open(b.u,'_blank'); else toast('링크가 없습니다'); return; }
  try{ busy(true,'책을 준비하는 중…','',0);
    const buf=await getBook(b);
    busy(true,'화면을 구성하는 중…','',1);
    await showReader(b,buf); busy(false);
  }catch(e){ busy(false); log('열기 실패: '+(e.message||e));
    toast('열지 못했습니다\n'+(e.message||e),6000); }
}
async function getBook(b){
  const hit=await DB.get('books',b.i); if(hit)return hit;
  busy(true,'구글 로그인 확인 중…','',0);
  const at=await needToken(false).catch(()=>needToken(true));
  busy(true,'책을 받는 중…',b.z?b.z+'MB':'',0);
  abort=new AbortController();
  const url=`https://www.googleapis.com/drive/v3/files/${b.i}?alt=media&supportsAllDrives=true`;
  const res=await fetch(url,{headers:{Authorization:'Bearer '+at},signal:abort.signal});
  if(res.status===401||res.status===403){ TOKEN=''; sessionStorage.removeItem('ebl_at');
    markLogin(false); throw new Error('드라이브 접근 거부 ('+res.status+')\n🔑 로 다시 로그인해 주세요.'); }
  if(!res.ok)throw new Error('드라이브 응답 '+res.status);
  const total=Number(res.headers.get('content-length')||0)||(b.z?b.z*1048576:0);
  let buf;
  if(res.body&&res.body.getReader){
    const rd=res.body.getReader(),parts=[]; let got=0;
    for(;;){ const{done,value}=await rd.read(); if(done)break; parts.push(value); got+=value.length;
      busy(true,null,(got/1048576).toFixed(1)+'MB'+(total?' / '+(total/1048576).toFixed(1)+'MB':''),
        total?got/total:0); }
    buf=await new Blob(parts).arrayBuffer();
  } else buf=await res.arrayBuffer();
  try{ await DB.put('books',b.i,buf); saved.add(b.i); }catch(e){ log('저장 실패: '+e.message); }
  return buf;
}

/* ── 리더 ── */
let book=null,rend=null,curB=null;
function paperCss(){
  const c={light:{bg:'#ffffff',fg:'#16181c',a:'#1a56b8'},
           sepia:{bg:'#f6efe2',fg:'#3b3228',a:'#8a5a1f'},
           night:{bg:'#15181c',fg:'#c7ccd4',a:'#7fb3ff'}}[P.theme];
  const fam = P.font==='sans' ? '-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif'
            : P.font==='serif'? '"Apple SD Gothic Neo","Nanum Myeongjo",serif' : '';
  // 좌우 여백은 바깥 틀(#page)에서 줍니다. 여기서 padding 을 주면 단 나누기가 어긋납니다.
  const body={ background:c.bg+' !important', color:c.fg+' !important',
    'padding-left':'0 !important', 'padding-right':'0 !important',
    'margin-left':'0 !important', 'margin-right':'0 !important',
    'line-height':(P.lh/100)+' !important' };
  if(fam) body['font-family']=fam+' !important';
  const txt={ color:c.fg+' !important', 'line-height':(P.lh/100)+' !important' };
  if(fam) txt['font-family']=fam+' !important';
  return { 'html, body':{background:c.bg+' !important'}, body,
    'p, div, span, li, td, th, dd, dt, blockquote':txt,
    'img, svg':{'max-width':'100% !important',height:'auto !important'},
    'a':{color:c.a+' !important'} };
}
function applyRead(){
  document.body.classList.remove('sepia','night');
  if(P.theme!=='light')document.body.classList.add(P.theme);
  document.documentElement.style.setProperty('--tap',P.tap+'%');
  document.documentElement.style.setProperty('--pv',P.pv+'px');
  document.documentElement.style.setProperty('--ph',P.pd+'%');
  $('#tapL').style.display=$('#tapR').style.display=(P.nav==='swipe'?'none':'block');
  if(rend){ rend.themes.register('paper',paperCss()); rend.themes.select('paper');
    rend.themes.fontSize(P.fs+'%');
    // 틀 크기가 바뀌었으니 다시 계산 (안 하면 글이 잘립니다)
    // 슬라이더를 미는 동안 수십 번 불리므로 잠깐 모아서 한 번만
    clearTimeout(applyRead._r);
    applyRead._r=setTimeout(()=>{ requestAnimationFrame(()=>{
      try{ rend.resize(); }catch(e){} }); }, 120);
  }
  $('#vFs').textContent=P.fs+'%'; $('#vLh').textContent=(P.lh/100).toFixed(2);
  $('#vPd').textContent=P.pd+'%'; $('#vPv').textContent=P.pv+'px'; $('#vTap').textContent=P.tap+'%';
  segSet('#segTheme',P.theme); segSet('#segFont',P.font); segSet('#segNav',P.nav);
  $('#rgFs').value=P.fs; $('#rgLh').value=P.lh; $('#rgPd').value=P.pd;
  $('#rgPv').value=P.pv; $('#rgTap').value=P.tap;
}
async function showReader(b,buf){
  curB=b;
  $('#library').style.display='none'; $('#reader').style.display='flex';
  $('#rtitle').textContent=b.t||''; $('#page').innerHTML='';
  book=ePub(buf);
  rend=book.renderTo('page',{width:'100%',height:'100%',flow:'paginated',spread:'none'});
  applyRead();
  const cfi=localStorage.getItem('ebl_pos_'+b.i);
  try{ await rend.display(cfi||undefined); }catch(e){ await rend.display(); }
  markRead(b.i,null);            // 연 것만으로 '읽는 중'에 들어갑니다
  rend.on('relocated',loc=>{
    if(loc?.start?.cfi)localStorage.setItem('ebl_pos_'+b.i,loc.start.cfi);
    const p=loc?.start?.percentage;
    markRead(b.i, p, loc&&loc.atEnd);
    const st=stOf(b);
    $('#rfoot').textContent=(p!=null?Math.round(p*100)+'%  ·  ':'')
      +(st==='done'?'다 읽음  ·  ':'')+(b.t||'');
  });
  // 책 안쪽(iframe)에만 붙입니다. 바깥 문서는 아래에서 한 번만 붙여둡니다.
  rend.on('rendered',(s,i)=>{ try{ bindGestures(i.document); }catch(e){} });
}

const readerOn = () => $('#reader').style.display==='flex';
function canPage(e){
  // 리더가 열려 있고 책이 준비됐을 때만. 설정판·막대를 누른 건 제외합니다.
  if(!rend || !readerOn()) return false;
  const t = e.target;
  if(t && t.closest && t.closest('.pan, #rbar, #rfoot, .sheet, #busy')) return false;
  return true;
}
function bindGestures(doc){
  doc.addEventListener('click',e=>{
    if(!canPage(e)) return;
    if(P.nav==='swipe'){ toggleBars(); return; }
    const w=window.innerWidth,x=e.clientX,t=P.tap/100;
    if(x<w*t)rend.prev(); else if(x>w*(1-t))rend.next(); else toggleBars();
  });
  bindSwipe(doc);
}
function bindSwipe(doc){
  let sx=0,sy=0,st=0;
  doc.addEventListener('touchstart',e=>{ const t=e.changedTouches[0];
    sx=t.clientX; sy=t.clientY; st=Date.now(); },{passive:true});
  doc.addEventListener('touchend',e=>{
    if(P.nav==='tap'||!canPage(e))return;
    const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(Date.now()-st<600&&Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.6){
      dx<0?rend.next():rend.prev(); }
  },{passive:true});
}
/* 바깥 문서에는 '밀어서 넘기기'만, 시작할 때 한 번만 붙입니다 */
bindSwipe(document);
function toggleBars(){ $('#rbar').classList.toggle('hide'); $('#rfoot').classList.toggle('hide'); }
function closeReader(){ $('#reader').style.display='none'; $('#library').style.display='flex';
  try{ book&&book.destroy&&book.destroy(); }catch(e){}
  book=null; rend=null; curB=null; paintTabs(); render(true); }

/* ── 설정판 ── */
function segSet(sel,v){ $$(sel+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===String(v))); }
function seg(sel,key,after){ $$(sel+' button').forEach(b=>b.onclick=()=>{

function pan(id,on){ $(id).classList.toggle('on',on); $('#bd').classList.toggle('on',on); }
$('#bd').onclick=()=>{ pan('#panRead',false); pan('#panView',false); };
$$('.pan [data-close]').forEach(b=>b.onclick=()=>{pan('#panRead',false);pan('#panView',false);});
$('#btnAa').onclick=()=>{ applyRead(); pan('#panRead',true); };

$$('#segFmt button').forEach(b=>b.onclick=()=>{

seg('#segTheme','theme',applyRead);

['#rgFs:fs','#rgLh:lh','#rgPd:pd','#rgPv:pv','#rgTap:tap'].forEach(x=>{

/* ── 상태 탭 ── */
function paintTabs(){
  const n={ '':BOOKS.length, recent:0, reading:0, done:0, saved:saved.size };
  BOOKS.forEach(b=>{ const s=stOf(b); if(RD[b.i])n.recent++; if(s)n[s]++; });
  $$('#tabs button').forEach(x=>{
    const v=x.dataset.v;
    x.classList.toggle('on',TAB===v);
    const base=x.textContent.replace(/\s*\d[\d,]*$/,'').trim();
    x.innerHTML = base + (v&&n[v]!=null ? ` <span class="n">${n[v].toLocaleString()}</span>` : '');
  });
}
$$('#tabs button').forEach(x=>x.onclick=()=>{
  TAB=x.dataset.v; localStorage.setItem('ebl_tab',TAB);
  SEL=''; PATH=[]; paintTabs(); buildChips(); render(true);
});
$('#mkDone').onclick=()=>{ if(!curB)return; markRead(curB.i,1,true);
  toast('다 읽음으로 표시했습니다'); };
$('#mkReading').onclick=()=>{ if(!curB)return; markRead(curB.i,null,false,true);
  toast('읽는 중으로 되돌렸습니다'); };

/* ── 이벤트 ── */
$('#q').addEventListener('input',()=>{clearTimeout($('#q')._t);$('#q')._t=setTimeout(()=>render(true),130);});
$('#grid').addEventListener('scroll',()=>{const g=$('#grid');
  if(shown<rows.length&&g.scrollTop+g.clientHeight>g.scrollHeight-400)render(false);});
$('#btnLogin').onclick=async()=>{ try{ await needToken(true); toast('로그인됐습니다'); }
  catch(e){ toast(e.message,5000); } };
$('#btnClose').onclick=closeReader;
$('#tapL').onclick=()=>{ if(rend&&readerOn()) rend.prev(); };
$('#tapR').onclick=()=>{ if(rend&&readerOn()) rend.next(); };
document.addEventListener('keydown',e=>{ if($('#reader').style.display!=='flex')return;
  if(e.key==='ArrowLeft')rend&&rend.prev(); if(e.key==='ArrowRight')rend&&rend.next();
  if(e.key==='Escape')closeReader(); });
window.addEventListener('resize',()=>{ if(rend)try{rend.resize()}catch(e){} });

$('#btnSet').onclick=()=>{ $('#sUrl').value=cfg('url'); $('#sTok').value=cfg('tok');
  $('#sCid').value=cfg('cid'); $('#log').textContent=LOG.join('\n');
  $('#setSheet').classList.add('on'); useInfo(); };
$('#setCancel').onclick=()=>$('#setSheet').classList.remove('on');
$('#setSave').onclick=()=>{ setCfg('url',$('#sUrl').value.trim()); setCfg('tok',$('#sTok').value.trim());
  setCfg('cid',$('#sCid').value.trim()); location.reload(); };
$('#btnSync2').onclick=async()=>{ try{ toast('목록을 새로 받는 중…'); await fetchIndex();
  buildChips(); render(true); toast('갱신했습니다'); }catch(e){ toast(e.message,5000); } };
/* ── 저장 공간 ──
   파일(IndexedDB)과 읽은 기록(localStorage)은 원래 따로 삽니다.
   버튼도 따로 두어 무엇이 지워지는지 분명히 합니다. */
async function useInfo(){
  const el=$('#useInfo'); if(!el) return;
  let s=`  ·  받아둔 책 ${saved.size}권`;
  try{ if(navigator.storage&&navigator.storage.estimate){
    const e=await navigator.storage.estimate();
    if(e&&e.usage) s+=`  ·  약 ${(e.usage/1048576).toFixed(0)}MB`;
  } }catch(e){}
  el.textContent=s;
}
$('#btnClearDone').onclick=async()=>{
  const hit=[...saved].filter(i=>RD[i]&&RD[i].f);
  if(!hit.length){ toast('다 읽고 받아둔 책이 없습니다'); return; }
  if(!confirm(`다 읽은 책 ${hit.length}권의 파일을 지웁니다.\n읽은 기록은 그대로 남습니다.`)) return;
  for(const i of hit){ try{ await DB.del('books',i); saved.delete(i); }catch(e){} }
  toast(`${hit.length}권의 파일을 비웠습니다`); useInfo(); paintTabs(); render(true);
};
$('#btnClearBooks').onclick=async()=>{
  if(!saved.size){ toast('받아둔 파일이 없습니다'); return; }
  if(!confirm(`받아둔 파일 ${saved.size}권을 모두 지웁니다.\n읽은 기록은 그대로 남습니다.`)) return;
  await DB.clear('books'); saved.clear();
  toast('받아둔 파일을 비웠습니다'); useInfo(); paintTabs(); render(true);
};
$('#btnClearRead').onclick=()=>{
  const n=Object.keys(RD).length;
  if(!n){ toast('지울 기록이 없습니다'); return; }
  if(!confirm(`${n}권의 읽은 기록을 지웁니다.\n진도와 '다 읽음' 표시가 사라집니다.\n파일은 그대로 둡니다.`)) return;
  RD={}; saveRD();
  try{ Object.keys(localStorage).filter(k=>k.indexOf('ebl_pos_')===0)
        .forEach(k=>localStorage.removeItem(k)); }catch(e){}
  TAB=''; localStorage.setItem('ebl_tab','');
  toast('읽은 기록을 지웠습니다'); paintTabs(); render(true);
};
$('#btnClearAll').onclick=async()=>{
  if(!confirm('파일·읽은 기록·목록·보기 설정을 모두 지웁니다.\n연결 설정(주소·토큰)은 남겨 둡니다.\n계속할까요?')) return;
  await DB.clear('books'); await DB.clear('kv');
  const keep={url:1,tok:1,cid:1};
  try{ Object.keys(localStorage)
        .filter(k=>k.indexOf('ebl_')===0 && !keep[k.slice(4)])
        .forEach(k=>localStorage.removeItem(k)); }catch(e){}
  sessionStorage.clear(); toast('초기화했습니다'); setTimeout(()=>location.reload(),800); };

window.addEventListener('error',e=>log('오류: '+e.message));
window.addEventListener('unhandledrejection',e=>log('오류(비동기): '+(e.reason?.message||e.reason)));

log('빌드 '+BUILD);
applyRead();
markLogin(false);
(async()=>{ await boot(); paintTabs(); buildChips(); render(true); })();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(r=>{ r.update();
    r.addEventListener('updatefound',()=>{ const w=r.installing;
      w&&w.addEventListener('statechange',()=>{
        if(w.state==='installed'&&navigator.serviceWorker.controller)
          toast('새 버전이 있습니다. 앱을 다시 열어주세요.',6000); }); }); }).catch(()=>{});
}
</script>
</body>
</html>
